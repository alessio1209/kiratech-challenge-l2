apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voting-app

resources:
  - ../../base
  - namespace.yaml

secretGenerator:
  - name: db-credentials
    envs:
      - .env

patches:
  - target:
      kind: Deployment
      name: db
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: db-credentials
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-credentials
                key: POSTGRES_PASSWORD
  - path: patch-network.yaml
  - path: patch-resilience.yaml