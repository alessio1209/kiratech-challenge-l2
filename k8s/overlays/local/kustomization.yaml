apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voting-app

resources:
  - ../../base

secretGenerator:
  - name: db-credentials
    literals:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Password@1234!

patches:
  - path: patch-db-secret.yaml
  - path: patch-network.yaml
  - path: patch-resilience.yaml