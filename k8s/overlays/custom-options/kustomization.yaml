apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voting-app

resources:
  - ../local

configMapGenerator:
  - name: vote-options
    literals:
      - OPTION_A=Pizza
      - OPTION_B=Pasta

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: patch-vote-options.yaml