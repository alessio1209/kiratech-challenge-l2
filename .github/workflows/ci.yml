name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-kustomize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup del file .env per la CI
        # Copia il file di esempio in .env in modo che Kustomize non vada in errore
        run: cp k8s/overlays/local/.env.example k8s/overlays/local/.env

      - name: Test build Overlay Local
        run: kubectl kustomize k8s/overlays/local > /dev/null

      - name: Test build Overlay Incident-Image
        run: kubectl kustomize k8s/overlays/incident-image > /dev/null

      - name: Test build Overlay Incident-Service
        run: kubectl kustomize k8s/overlays/incident-service > /dev/null

      - name: Test build Overlay Custom-Options
        run: kubectl kustomize k8s/overlays/custom-options > /dev/null